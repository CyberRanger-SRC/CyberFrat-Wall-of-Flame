<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/cyberfrat-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberFrat Diwali 3D • Festival of Lights</title>
    <!-- Google Fonts: Cinzel, Cinzel Decorative, Plus Jakarta Sans, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700;900&family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      html, body, #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #030308;
        color: #ffffff;
        font-family: 'Montserrat', sans-serif;
      }
      .font-cinzel {
        font-family: 'Cinzel', serif;
      }
      /* Custom scrollbars for modals */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(10, 10, 20, 0.4);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 180, 0, 0.3);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 200, 50, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
